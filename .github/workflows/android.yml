name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''      # skip the obsolete default "tools" package; we install what we need below
      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Fetch embedding model (all-MiniLM-L6-v2, int8 ARM64)
        run: |
          mkdir -p app/src/main/assets/embedding
          B=https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main
          curl -L --fail --retry 4 --retry-delay 5 -o app/src/main/assets/embedding/model.onnx "$B/onnx/model_qint8_arm64.onnx"
          curl -L --fail --retry 4 --retry-delay 5 -o app/src/main/assets/embedding/vocab.txt "$B/vocab.txt"
          test "$(stat -c%s app/src/main/assets/embedding/model.onnx)" -gt 10000000
          test "$(stat -c%s app/src/main/assets/embedding/vocab.txt)" -gt 200000
          sha256sum app/src/main/assets/embedding/*

      - name: Unit tests
        continue-on-error: true      # a failing test is reported but does not block the APK
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Prepare release signing key
        id: sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "have=true" >> "$GITHUB_OUTPUT"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret found: only the debug APK will be built."
          fi

      - name: Build signed release APK
        if: steps.sign.outputs.have == 'true'
        env:
          KEYSTORE_FILE: ${{ steps.sign.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ENABLE_R8: ${{ vars.ENABLE_R8 }}
        run: gradle assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: PrivateAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.have == 'true'
        with:
          name: PrivateAI-release-apk
          path: app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Publish release (signed APK)
        if: startsWith(github.ref, 'refs/tags/v') && steps.sign.outputs.have == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
      - name: Publish release (debug APK, because no signing key is set)
        if: startsWith(github.ref, 'refs/tags/v') && steps.sign.outputs.have != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
